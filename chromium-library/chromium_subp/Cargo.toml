[package]
name = "chromium"
version = "76.0.6"
authors = ["Make Technology <http://maketechnology.io>", "Guillermo Zunino <guillez@gmail.com>"]

[[bin]]
name = "chromium_subp"
path = "src/bin/chromium_subp.rs"

[profile.release]
lto = true
codegen-units = 1

[dependencies]

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser", "libloaderapi"] }

[features]
gen = ["bindgen"]

[build-dependencies]
bindgen = { version = "0.41.0", optional = true }
